# PRF routing labels - sidecar to rules/reliability-rules.yaml.
# One entry per rule id, same order as the corpus. Labels only ever ADD material to
# a routed selection; a missing or unreviewed label never excludes a rule.
#   risk        R read-only, W write/update, D destructive, N network/outbound,
#               C credential/identity (multi-valued, never collapsed to one class)
#   topics      controlled vocabulary, multi-valued
#   depends_on  rules loaded whenever this rule is selected (closure is transitive)
#   resident    true for the always-loaded hard rules
# rules_blob is the git blob id of rules/reliability-rules.yaml these labels were
# reviewed against; tools/validate.py fails when the corpus changes underneath.
